name: GitHub Pages

# Statikus kiadás: a public/ mappa megy a GitHub Pages-re, előtte a
# build.mjs a kategória-aloldalakat, a build-pages.mjs pedig a
# témaoldalakat, a hírcsatornát és a naptárat generálja.
#
# A refresh.yml a GITHUB_TOKEN-nel commitol, ami NEM indít push-eseményt,
# ezért az adatfrissítés után a workflow_run trigger élesít újra.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Frissítés"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run esetén is a main legfrissebb állapota kell (a frissítő commitja)
          ref: main

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kategória-aloldalak + sitemap generálása
        run: node build.mjs

      - name: Témaoldalak, hírcsatorna, naptár
        run: node build-pages.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
